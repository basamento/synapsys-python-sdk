name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Verify tag and package versions
        shell: python
        run: |
          import pathlib
          import re
          import tomllib
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          init = pathlib.Path("src/basamento_synapsys/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"$', init, re.MULTILINE)
          if project["project"]["version"] != expected or not match or match.group(1) != expected:
              raise SystemExit("Tag, pyproject.toml, and __version__ must agree")
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
